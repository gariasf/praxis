# CodeRabbit configuration for Praxis.
# Schema: https://coderabbit.ai/integrations/schema.v2.json
#
# Role: second-opinion reviewer, after the agent's own review
# (docs/agents/workflow.md, "Review"). CI owns mechanical checks; the agent
# owns every fix; CodeRabbit never writes to a branch, so its finishing
# touches stay off.
# Config is read from the PR's own branch, so a PR that edits this file is
# reviewed under its own edit. Every change here is named under "Decide"
# in the PR description.

language: en-GB

# 250-char limit.
tone_instructions: >-
  Terse. Report correctness, safety, budget regressions and ADR conflicts,
  each as the change plus the reason in two lines. Style is owned by
  rustfmt and clippy.

reviews:
  profile: chill
  request_changes_workflow: false
  # The PR description is the summary. With this on, CodeRabbit skips the
  # description check.
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  related_prs: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    # The plan includes 5 reviews per rolling hour. One review per PR
    # starts automatically; a verification pass is requested with
    # `@coderabbitai review` when a fix warrants it.
    auto_incremental_review: false

  path_filters:
    - "!target/**"
    - "!**/*.glb"
    - "!**/*.gltf"
    - "!**/*.bin"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.hdr"
    - "!**/*.ktx2"
    - "!docs/research/**"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Review against CLAUDE.md and docs/agents/workflow.md. Report only:
        - correctness and safety bugs;
        - GPU lifetime mistakes: resources not recreated on resize, bind
          groups not rebuilt with the buffer they reference;
        - WGSL bind group bindings that differ from the Rust bind group
          layouts (struct and vertex layouts are checked by cargo test);
        - budget risks in hot paths: per-frame allocation, per-entity GPU
          calls that could batch, CPU-GPU sync mid-frame, unbounded growth;
        - unwrap or expect on GPU or I/O results in render paths;
        - GPU data stored on ECS components;
        - work beyond the linked ticket's acceptance criteria.
        Skip style, naming taste, and comments on unchanged code.

    - path: "src/**/*.wgsl"
      instructions: |
        Apply the WGSL rules in CLAUDE.md's review checklist. Also flag:
        sRGB/linear confusion; divide-by-zero and NaN risks at grazing
        angles or zero roughness; textureSample under non-uniform control
        flow; f32 precision loss at large world coordinates.

    - path: "Cargo.toml"
      instructions: |
        A new or bumped dependency is an owner decision: it needs a
        justification in the PR description. Flag dependencies without
        default-features = false and an explicit features list, unless
        the crate's defaults are already minimal.

    - path: "docs/adr/**"
      instructions: |
        An ADR records a hard-to-reverse, surprising decision with a real
        trade-off, in one to three sentences. Flag contradictions with
        other ADRs and with CONTEXT.md vocabulary.

    - path: "CONTEXT.md"
      instructions: |
        Glossary only. Flag implementation detail, general programming
        terms, and words that appear under another term's _Avoid_ list.

    - path: "docs/agents/**"
      instructions: |
        Instructions are positive, checkable, and consistent across
        docs/agents. Flag commands that do not match real gh or git
        behaviour, labels that do not exist, and drift from CLAUDE.md.

    - path: ".github/workflows/**"
      instructions: |
        Least-privilege permissions, pinned action versions, deterministic
        steps, and cache keys that cannot be poisoned.

    - path: ".coderabbit.yaml"
      instructions: |
        This file configures the review of the PR that edits it. Flag any
        change that loosens a check, narrows review scope, or turns a
        feature off, and require the PR description to name it under
        Decide.

    - path: "PLAN.md"
      instructions: |
        Phase scratch, paused and superseded by tickets. Do not review for
        completeness or stylistic consistency.

    - path: "CLAUDE.md"
      instructions: |
        If this PR changes folder structure, a cross-cutting convention,
        or an ADR without updating CLAUDE.md, flag the drift and name the
        stale sections.

    - path: "ROADMAP.md"
      instructions: |
        Being migrated into ADRs and the map issue. Flag new load-bearing
        decisions added here instead of docs/adr/.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: "Imperative mood, 72 characters at most, no ticket-number prefix."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    # Custom checks need Team, with an open-source exception for public
    # repos. If the walkthrough never shows them, they are not running.
    custom_checks:
      - name: "One ticket per PR"
        mode: "warning"
        instructions: >-
          Pass/fail criteria: pass when the description names exactly one
          ticket as `Closes #<number>`, or says `Ticket: n/a` with a reason
          (docs, ADR, process, or bootstrap PRs). Fail when it lists two or
          more tickets, or has neither.
      - name: "Evidence and metrics"
        mode: "warning"
        instructions: >-
          Pass/fail criteria: pass when the description has a Verification
          section holding the command run and its output. When the diff
          touches src/render, src/assets, or .wgsl files, the Metrics
          section must also state a delta against baseline or give a reason
          none applies. Docs-only diffs pass with `n/a`. Fail otherwise.
      - name: "Size ceiling"
        mode: "warning"
        instructions: >-
          Pass/fail criteria: pass when the diff changes about 400 lines or
          fewer, not counting goldens, lockfiles, and generated or cooked
          data. Above that, report Inconclusive and ask whether the change
          should split along a seam or be an expand-contract migration.

  finishing_touches:
    docstrings:
      enabled: false
    autofix:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false

  tools:
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    clippy:
      enabled: false

chat:
  auto_reply: false
  art: false

knowledge_base:
  opt_out: false
  code_guidelines:
    filePatterns:
      - "CLAUDE.md"
      - "docs/agents/workflow.md"
      - "CONTEXT.md"
      - "docs/adr/*.md"
      - "CODING_STANDARDS.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
