quote = '''To save computational cost, similarly to Lee et al. [Lee et al. 2017] we do not sample the ellipse in the shader but rely on screen-space jittering within the pixel to approximately sample the same extent. [...] Unlike current GPU hardware filtering, which has a maximum anisotropy ratio of 16, our method allows any anisotropy. We limit the ratio to 64 to avoid GPU texture cache thrashing, rescaling the minor axis if necessary. [...] Therefore, the technique as described is no longer filtering after shading, but a hybrid between filtering before and after shading. The choice of MIP map defines the degree to which the textures are prefiltered and the resulting error. This error can be reduced by using finer levels of the MIP chain, which can be achieved by applying a negative LOD bias or by increasing the maximum amount of anisotropy.'''
