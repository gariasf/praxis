section = "McCormack, Perry, Farkas, Jouppi, Feline, SIGGRAPH 99, §2.3 Texram"
quote = '''Texram has other problems that manifest themselves as aliasing artifacts. Its sampling line is usually much shorter than the ellipse, and the trilinear probes can be spaced too far apart. Texram always uses 2ⁿ equally weighted probes, which causes poor high-frequency rejection along the major axis. These problems make Texram’s visual quality noticeably inferior to EWA.'''
