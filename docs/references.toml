url = "https://graphicon.ru/oldgr/library/siggraph/99/papers/mccormac/mccormac.pdf"
section = "McCormack, Perry, Farkas, Jouppi, Feline, SIGGRAPH 99, §5 Conclusions (cost otherwise only as Figure 23, cycles/pixel chart)"
quote = '''Feline provides nearly the visual quality of EWA, but with much simpler setup and texel visiting logic, and many fewer cycles per textured pixel. [...] Feline can be built on top of an existing trilinear filter implementation; for better results, the trilinear filter can be converted to a mip-mapped Gaussian at little cost. Since several aspects of Feline are parameterized, Feline can gracefully degrade image quality in order to keep frame rates high during movement. This degradation might accentuate aliasing for irregular textures, in order to preserve image sharpness, and accentuate blurring for repeated regular textures, in order to avoid Moiré artifacts.'''
