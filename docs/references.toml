# The registry of external sources the engine relies on: papers, books,
# specifications, vendor documents and other codebases.
#
# Each entry is a table keyed by a short name of lowercase letters, digits,
# dots and hyphens, quoted so a dot stays part of the name:
#
#   ["author-section"]
#   url = "a stable URL or DOI, pinned to a version or commit where one exists"
#   section = "the section, equation, table or line relied on"
#   quote = '''the claim relied on, verbatim: each gap marked [...], a table's
#   rows as "cell: cell", and typeset mathematics written in Unicode'''
#   checked = 2026-01-31  # the date the quote was last read in the source
#
# Code, ADRs and notes cite an entry by its key in square brackets after
# `ref:`, beside their prose citation. `cargo test --test references` fails on
# a cited key with no entry, an entry cited nowhere, and a malformed citation
# or key. Review's Sources
# axis re-checks only the entries a diff adds or changes, and the citations
# that point at them (`docs/agents/workflow.md`, Review).

