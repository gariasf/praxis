["mccormack-1999-feline-probes"]
url = "https://graphicon.ru/oldgr/library/siggraph/99/papers/mccormac/mccormac.pdf"
section = "Joel McCormack, Ronald Perry, Keith I. Farkas, Norman P. Jouppi, Feline: Fast Elliptical Lines for Anisotropic Texture Mapping, SIGGRAPH 99 (copy of the proceedings paper), Abstract and §3.1 The Desired Computations"
quote = '''But trilinear filtering represents the projection of a pixel filter footprint from screen space into texture space as a square, when in reality the footprint may be long and narrow. Consequently, trilinear filtering severely blurs images on surfaces angled obliquely away from the viewer. [...] Feline’s visual quality compares well against Elliptical Weighted Average, the best software anisotropic texture filtering algorithm known to date, but Feline requires much less setup computation and far fewer cycles for texel fetches. [...] The combination of multiple isotropic probes should closely match the shape of the EWA filter. Thus, the probe points should occur along the major axis of the ellipse, the probes should be Gaussian weighted, and the probe filter width should be equal to the minor axis of the ellipse. [...] we clamp the radii to a minimum of one texel: [...] fProbes = 2*(majorRadius/minorRadius) – 1; iProbes = floor(fProbes + 0.5); if (iProbes > maxProbes) iProbes = maxProbes; To guarantee that texturing a pixel occurs in a bounded time, we clamp iProbes to a programmable value maxProbes.'''
