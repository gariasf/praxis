["mccormack-1999-ewa-blur-and-setup"]
url = "https://graphicon.ru/oldgr/library/siggraph/99/papers/mccormac/mccormac.pdf"
section = "McCormack, Perry, Farkas, Jouppi, Feline, SIGGRAPH 99, §2.1 Elliptical Weighted Average"
quote = '''These setup computations, plus logic to visit only texels in or near the ellipse and compute d², have thus far precluded hardware implementation of EWA. The only complaint that can be leveled against EWA’s visual quality is its choice of a Gaussian filter. Other filters produce sharper images without introducing more aliasing artifacts (see Wolberg [13] for an excellent discussion). However, these filters have a radius of two or three pixels, which increases the work required to compute a textured pixel by a factor of four or nine.'''
