quote = '''Using the level selection rule above, we can filter any circle with a minimum of 9 and a maximum of 25 pixel accesses, independent of the size of the circle in the original texture image. [...] Since eccentricities are unbounded for arbitrary mappings, this area is unbounded, so the cost of EWA filtering of ellipses is unbounded. [...] Fattening the ellipse (increasing its minor axis) will cause lateral blurring, and shortening the ellipse (decreasing its major axis) will cause longitudinal aliasing. It is probably best to opt for blurring. Tests show that a threshold of eₘₐₓ = 20 or 30 produces very good results. Note that clamping the eccentricity of the EWA filter bounds the computation required for one filtering operation, thereby making EWA a constant cost filter.'''
