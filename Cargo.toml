[package]
name = "praxis"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "0.30"
glam = "0.32"
tracing = "0.1"
pollster = "0.4"
anyhow = "1"
bytemuck = "1.25.0"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils"], optional = true }
bevy_ecs = { version = "0.18.1", features = ["trace", "debug", "multi_threaded"] }
bevy_tasks = { version = "0.18.1", default-features = false, features = ["multi_threaded"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy_mikktspace = { version = "1.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
intel_tex_2 = { version = "0.5.0", optional = true }
ktx2 = "0.5.0"
meshopt = "0.6.2"
zstd = { version = "0.14.2", default-features = false }
offset-allocator = "0.2.0"

[dev-dependencies]
# Goldens are PNGs, read and written in tests with or without `cook`.
image = { version = "0.25", default-features = false, features = ["png"] }
texture2ddecoder = "0.1.2"
# shader_tests validates WGSL with the Capability floor, mapped as wgpu maps it.
wgpu-naga-bridge = "30"

[features]
default = ["cook"]
# The cooker, `praxis cook` and `praxis capture`; a shipping build turns it
# off and links no source decoder or encoder (ADR 0018).
cook = ["dep:bevy_mikktspace", "dep:gltf", "dep:image", "dep:intel_tex_2"]

# Cooking in tests decodes, hashes and compresses megabytes of texels; these
# are the crates doing it, optimised so the verify command keeps its budget.
[profile.dev.package]
adler2.opt-level = 3
crc32fast.opt-level = 3
fdeflate.opt-level = 3
image.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
sha2.opt-level = 3
simd-adler32.opt-level = 3
zstd-sys.opt-level = 3
