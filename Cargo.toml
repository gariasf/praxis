[package]
name = "praxis"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "0.30"
glam = "0.32"
tracing = "0.1"
pollster = "0.4"
anyhow = "1"
bytemuck = "1.25.0"
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils"] }
bevy_ecs = { version = "0.18.1", features = ["trace", "debug", "multi_threaded"] }
bevy_tasks = { version = "0.18.1", default-features = false, features = ["multi_threaded"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy_mikktspace = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
ktx2 = "0.5.0"
zstd = { version = "0.14.2", default-features = false }

[features]
default = ["cook"]
# The cooker and `praxis cook`; a shipping build turns it off (ADR 0018).
cook = []
