[workspace]
resolver = "2"
members = [
    "praxis",
    "praxis_assets",
    "praxis_audio",
    "praxis_ecs",
    "praxis_graphics",
    "praxis_gui",
    "praxis_input",
    "praxis_math",
    "praxis_physics",
    "praxis_scene",
    "praxis_utils",
    "praxis_window"
]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

