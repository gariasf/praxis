[package]
name = "praxis"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Guillem Arias <hello@gariasf.com>"]

[workspace]
resolver = "2"
members = [
    "crates/praxis_core",
    "crates/praxis_assets",
    "crates/praxis_audio",
    "crates/praxis_ecs",
    "crates/praxis_graphics",
    "crates/praxis_gui",
    "crates/praxis_input",
    "crates/praxis_math",
    "crates/praxis_physics",
    "crates/praxis_scene",
    "crates/praxis_utils",
    "crates/praxis_window"
]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[dependencies]
praxis_core = { path = "crates/praxis_core", version = "0.1.0" }
praxis_utils = { path = "crates/praxis_utils", version = "0.1.0" }


[[example]]
name = "hello_praxis"
path = "examples/hello_praxis.rs"
doc-scrape-examples = true