[package]
name = "praxis"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Guillem Arias <hello@gariasf.com>"]
description = "A 3D game engine in Rust for educational purposes"
repository = "https://github.com/gariasf/praxis"
keywords = ["gamedev", "graphics", "engine", "vulkan", "ecs"]
categories = ["game-engines", "graphics", "rendering"]

[features]
default = []
editor = ["praxis_editor"]
networking = ["praxis_networking"]
scripting = ["praxis_scripting", "praxis_gui/scripting"]
terrain = ["praxis_terrain", "praxis_editor?/terrain"]
headless = []

[workspace]
resolver = "2"
members = [
    "crates/praxis_core",
    "crates/praxis_assets",
    "crates/praxis_audio",
    "crates/praxis_ecs",
    "crates/praxis_editor",
    "crates/praxis_graphics",
    "crates/praxis_gui",
    "crates/praxis_input",
    "crates/praxis_math",
    "crates/praxis_networking",
    "crates/praxis_physics",
    "crates/praxis_procedural",
    "crates/praxis_profiling",
    "crates/praxis_scene",
    "crates/praxis_scripting",
    "crates/praxis_spatial",
    "crates/praxis_terrain",
    "crates/praxis_utils",
    "crates/praxis_window",
]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[dependencies]
praxis_core = { path = "crates/praxis_core", version = "0.1.0" }
praxis_utils = { path = "crates/praxis_utils", version = "0.1.0" }
praxis_window = { path = "crates/praxis_window", version = "0.1.0" }
praxis_graphics = { path = "crates/praxis_graphics", version = "0.1.0" }
praxis_ecs = { path = "crates/praxis_ecs", version = "0.1.0" }
praxis_editor = { path = "crates/praxis_editor", version = "0.1.0", optional = true }
praxis_input = { path = "crates/praxis_input", version = "0.1.0" }
praxis_math = { path = "crates/praxis_math", version = "0.1.0" }
praxis_assets = { path = "crates/praxis_assets", version = "0.1.0" }
praxis_scene = { path = "crates/praxis_scene", version = "0.1.0" }
praxis_networking = { path = "crates/praxis_networking", version = "0.1.0", optional = true }
praxis_physics = { path = "crates/praxis_physics", version = "0.1.0" }
praxis_audio = { path = "crates/praxis_audio", version = "0.1.0" }
praxis_gui = { path = "crates/praxis_gui", version = "0.1.0" }
praxis_spatial = { path = "crates/praxis_spatial", version = "0.1.0" }
praxis_procedural = { path = "crates/praxis_procedural", version = "0.1.0" }
praxis_profiling = { path = "crates/praxis_profiling", version = "0.1.0" }
praxis_scripting = { path = "crates/praxis_scripting", version = "0.1.0", optional = true }
praxis_terrain = { path = "crates/praxis_terrain", version = "0.1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
