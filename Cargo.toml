[package]
name = "praxis"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Guillem Arias <hello@gariasf.com>"]

[workspace]
resolver = "2"
members = [
    "crates/praxis_core",
    "crates/praxis_assets",
    "crates/praxis_audio",
    "crates/praxis_ecs",
    "crates/praxis_graphics",
    "crates/praxis_gui",
    "crates/praxis_input",
    "crates/praxis_math",
    "crates/praxis_physics",
    "crates/praxis_scene",
    "crates/praxis_utils",
    "crates/praxis_window",
]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[dependencies]
praxis_core = { path = "crates/praxis_core", version = "0.1.0" }
praxis_utils = { path = "crates/praxis_utils", version = "0.1.0" }
praxis_window = { path = "crates/praxis_window", version = "0.1.0" }
praxis_graphics = { path = "crates/praxis_graphics", version = "0.1.0" }
praxis_ecs = { path = "crates/praxis_ecs", version = "0.1.0" }
praxis_input = { path = "crates/praxis_input", version = "0.1.0" }
praxis_math = { path = "crates/praxis_math", version = "0.1.0" }
praxis_assets = { path = "crates/praxis_assets", version = "0.1.0" }
praxis_scene = { path = "crates/praxis_scene", version = "0.1.0" }
praxis_physics = { path = "crates/praxis_physics", version = "0.1.0" }
praxis_audio = { path = "crates/praxis_audio", version = "0.1.0" }
winit = { version = "0.30.11", features = ["rwh_05"] }
pollster = "0.4"

[[example]]
name = "ecs_integration"
path = "examples/ecs_integration.rs"

[[example]]
name = "transform_propagation_demo"
path = "examples/transform_propagation_demo.rs"

[[example]]
name = "multi_mesh_demo"
path = "examples/multi_mesh_demo.rs"

[[example]]
name = "input_integration"
path = "examples/input_integration.rs"

[[example]]
name = "fps_camera_controller"
path = "examples/fps_camera_controller.rs"

[[example]]
name = "obj_loader_demo"
path = "examples/obj_loader_demo.rs"

[[example]]
name = "comprehensive_scene_demo"
path = "examples/comprehensive_scene_demo.rs"

[[example]]
name = "scene_demo"
path = "examples/scene_demo.rs"

[[example]]
name = "gui_demo"
path = "examples/gui_demo.rs"

[[example]]
name = "physics_demo"
path = "examples/physics_demo.rs"

[[example]]
name = "audio_demo"
path = "examples/audio_demo.rs"

[[example]]
name = "audio_simple"
path = "examples/audio_simple.rs"

[[example]]
name = "environment_probe_demo"
path = "examples/environment_probe_demo.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
vulkano = "0.35.1"

[[bench]]
name = "mesh_upload"
harness = false

[[bench]]
name = "render_loop"
harness = false

[[bench]]
name = "physics_step"
harness = false

[[bench]]
name = "transform_propagation"
harness = false
