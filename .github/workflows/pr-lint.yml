name: PR form

# Checks the PR's title, body, size and commits against docs/agents/workflow.md.
# Editing the title or body reruns this check alone, not CI.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    # Explicit, so a failing stage of a pipe fails its step.
    shell: bash

jobs:
  lint:
    name: PR body and commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts
            .github

      - name: Test the lint
        run: scripts/pr-lint-test.sh

      # The title, body, commit messages and changed paths reach the script
      # through environment variables and files, never expanded into the script
      # itself, so no text in them runs. A renamed file lists both its paths,
      # its changed lines beside the new one.
      - name: Lint the body, commits and rendering images
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s' "$BODY" >"$RUNNER_TEMP/body.md"
          mkdir "$RUNNER_TEMP/commits"
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/commits" \
            --jq '.[] | "\(.sha[0:12]) \(.commit.message | @base64)"' |
            while read -r sha message; do
              base64 -d <<<"$message" >"$RUNNER_TEMP/commits/$sha"
            done
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" \
            --jq '.[] | "\(.changes)\t\(.filename)", (.previous_filename // empty | "0\t\(.)")' \
            >"$RUNNER_TEMP/lines"
          scripts/pr-lint.sh "$NUMBER" "$TITLE" "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/lines" \
            "$RUNNER_TEMP"/commits/*
