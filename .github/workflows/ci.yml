name: CI

on:
  pull_request:
    branches: [main]
  # On main the run tests the merged commit, which PR checks never saw
  # (branches need not be up to date), and saves the caches PR runs restore.
  # Docs pushes skip it; PRs never do, as the required checks must report:
  # a docs-only PR skips the engine jobs instead (see `changes`).
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

# A newer push to a PR cancels the run it supersedes. Each push to main runs
# in a group of its own, so none is cancelled and every one publishes its
# Bench records; publishes that race retry on the branch's new tip.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The `vulkan-cpu` Goldens and the llvmpipe Baselines are this Mesa's
  # lavapipe. When the archive drops the version, install fails: re-record
  # both with the new one rather than let them drift. The Baselines'
  # directory names lavapipe's LLVM and vector width, so a runner that
  # changes either fails with "no Baseline" until they are re-recorded.
  LAVAPIPE_VERSION: 25.2.8-0ubuntu0.24.04.4

jobs:
  # Whether a pull request changes anything but docs: `docs/` and the root's
  # Markdown, which the build, the Goldens and the bench never read, while
  # `check` runs the tests that do. A job skipped by `if` reports success, so
  # the required checks pass on a docs-only PR. The engine jobs run unless
  # this says `false`, so a push or a failed listing runs them all.
  changes:
    name: Changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine_changed: ${{ steps.classify.outputs.engine_changed }}
    steps:
      # The merge commit and its first parent, the base it merges into.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # Without renames, a file moved out of `docs/` lists both its paths;
      # unquoted, a non-ASCII docs path still reads as docs.
      - name: Whether anything but docs changed
        id: classify
        run: |
          changed_paths=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
          echo "$changed_paths"
          if grep -qvE '^(docs/|[^/]*\.md$)' <<< "$changed_paths"; then
            echo engine_changed=true >> "$GITHUB_OUTPUT"
          else
            echo engine_changed=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check, Clippy & Format
    runs-on: ubuntu-latest
    steps:
      # The field guides' test asks git whether each page's commit is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  software-goldens:
    name: Goldens (software Vulkan)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine_changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      # The field guides' test asks git whether each page's commit is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers=$LAVAPIPE_VERSION

      # The Goldens' launches then find every Asset they load cooked, as
      # after `praxis cook` on a dev machine (ADR 0018).
      - name: Cook
        run: cargo run -- cook

      - name: Test
        env:
          PRAXIS_REQUIRE_GOLDENS: "1"
        run: cargo test

      - name: Upload Golden differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-differences
          path: target/tmp/golden-differences
          if-no-files-found: ignore

  shipping-goldens:
    # The runtime opens no source path (ADR 0018): a build without `cook`
    # links no source decoder, and renders every CI Golden from a cooked
    # `cooked/` with `assets/` absent.
    name: Goldens from a shipping build (software Vulkan)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine_changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers=$LAVAPIPE_VERSION

      - name: Clippy without cook
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: No source decoder linked
        run: |
          tree=$(cargo tree --no-default-features -e normal,build --prefix none)
          if echo "$tree" | grep -E '^(gltf|image|intel_tex_2|bevy_mikktspace) v'; then
            echo "linked without cook"; exit 1
          fi

      - name: Cook
        run: cargo run -- cook

      - name: Remove sources
        run: rm -r assets

      - name: Goldens
        env:
          PRAXIS_REQUIRE_GOLDENS: "1"
        run: cargo test --no-default-features --test goldens

      - name: Upload Golden differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipping-golden-differences
          path: target/tmp/golden-differences
          if-no-files-found: ignore

  software-bench:
    name: Bench counters (software Vulkan)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine_changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      benched: ${{ steps.bench.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers=$LAVAPIPE_VERSION

      # Timed for the release build's Bench record: the dependencies
      # rust-cache restored are not rebuilt, so a cache miss reads as a spike.
      - name: Build
        run: |
          started=$SECONDS
          cargo build --release
          echo $((SECONDS - started)) > target/release-build-seconds

      # Counters only: draw calls, Instances and triangles drawn, Instances
      # overflowed, uploaded bytes, GPU memory, Arena bytes in use and heap
      # allocations against the Baselines in bench/baselines/<llvmpipe key>.
      # Each scene renders its counter frames alone, which compare with a
      # Baseline of any length at CI's size: lavapipe's times mean nothing.
      - name: Bench
        id: bench
        run: target/release/praxis bench target/bench --ci-counters --no-publish

      - name: Compare
        run: target/release/praxis compare target/bench --ci

      # A new or changed Baseline is this artifact's file, copied into its
      # adapter's directory.
      - name: Upload bench results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: target/bench
          if-no-files-found: ignore

      # What publish-bench publishes: the results, the binary that measured
      # them, whose size it records, and its build's wall time. Uploaded on
      # every run that benched, so a PR's can be published to a scratch remote
      # by hand, and a failed compare on main still publishes the commit that
      # regressed.
      - name: Upload what publish-bench publishes
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-publish
          path: |
            target/bench/*.json
            target/release/praxis
            target/release-build-seconds
          retention-days: 3
          if-no-files-found: error

  # Publishes lavapipe's results and the release build beside them as Bench
  # records on bench-history (ADR 0024). Only a push to main runs it, and
  # only this job can write: code from a pull request never does. It runs
  # whenever the bench ran, whether or not its compare passed.
  publish-bench:
    name: Publish Bench records
    if: ${{ !cancelled() && github.event_name == 'push' && needs.software-bench.outputs.benched == 'success' }}
    needs: software-bench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-publish
          path: ${{ runner.temp }}/bench-publish

      - name: Publish
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/bench-publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chmod +x "$ARTIFACT_DIRECTORY/release/praxis"
          "$ARTIFACT_DIRECTORY/release/praxis" publish "$ARTIFACT_DIRECTORY/bench" \
            --release-build-seconds "$(cat "$ARTIFACT_DIRECTORY/release-build-seconds")"
