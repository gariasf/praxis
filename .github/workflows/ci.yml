name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Clippy & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  software-goldens:
    # Not a required check until two green weeks (#35).
    name: Goldens (software Vulkan)
    # Pinned: the `vulkan-cpu` Goldens are this image's Mesa lavapipe.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers

      - name: Record noise (bootstrap, removed before merge)
        run: |
          cargo test --test goldens --no-run
          for run in $(seq 1 20); do
            rm -rf tests/goldens/vulkan-cpu
            PRAXIS_UPDATE_GOLDENS=1 cargo test -q --test goldens procedural 2>/dev/null
            mkdir -p noise/$run && cp tests/goldens/vulkan-cpu/*.png noise/$run/
          done
          sha256sum noise/*/*.png | awk '{print $1, $2}' | sed 's|noise/[0-9]*/||' | sort | uniq -c
          rm -rf tests/goldens/vulkan-cpu

      - uses: actions/upload-artifact@v4
        with:
          name: noise
          path: noise

      - name: Test
        env:
          PRAXIS_REQUIRE_GOLDENS: "1"
        run: cargo test

      - name: Upload Golden differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-differences
          path: target/tmp/golden-differences
          if-no-files-found: ignore
