name: Performance Regression Testing

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libvulkan-dev \
            vulkan-validationlayers \
            mesa-vulkan-drivers
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-cache
      
      - name: Install benchmark comparison tool
        run: |
          cargo install --locked cargo-criterion || true
      
      # Run benchmarks on current branch (PR or push)
      - name: Run critical benchmarks on current branch
        run: |
          echo "Running benchmarks on current branch..."
          mkdir -p benchmark-results
          
          # Run multi-draw indirect benchmarks (critical for batching performance)
          cargo bench --bench graphics_optimization -- \
            "multi_draw_indirect" \
            --save-baseline current \
            --noplot \
            2>&1 | tee benchmark-results/multi-draw.txt
          
          # Run GPU culling benchmarks (critical for culling overhead)
          cargo bench --bench graphics_optimization -- \
            "gpu_vs_cpu_culling/gpu_culling" \
            --save-baseline current \
            --noplot \
            2>&1 | tee benchmark-results/gpu-culling.txt
          
          # Run descriptor allocation benchmarks (critical for allocation rate)
          cargo bench --bench descriptor_set_allocation -- \
            "descriptor_set_caching_lru" \
            --save-baseline current \
            --noplot \
            2>&1 | tee benchmark-results/descriptor-alloc.txt
          
          echo "Current branch benchmarks complete"
      
      # Checkout main branch and run baseline benchmarks
      - name: Checkout main branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          git checkout main
      
      - name: Run critical benchmarks on main branch (baseline)
        if: github.event_name == 'pull_request'
        run: |
          echo "Running benchmarks on main branch (baseline)..."
          
          # Run multi-draw indirect benchmarks
          cargo bench --bench graphics_optimization -- \
            "multi_draw_indirect" \
            --save-baseline main \
            --noplot \
            2>&1 | tee benchmark-results/multi-draw-baseline.txt
          
          # Run GPU culling benchmarks
          cargo bench --bench graphics_optimization -- \
            "gpu_vs_cpu_culling/gpu_culling" \
            --save-baseline main \
            --noplot \
            2>&1 | tee benchmark-results/gpu-culling-baseline.txt
          
          # Run descriptor allocation benchmarks
          cargo bench --bench descriptor_set_allocation -- \
            "descriptor_set_caching_lru" \
            --save-baseline main \
            --noplot \
            2>&1 | tee benchmark-results/descriptor-alloc-baseline.txt
          
          echo "Baseline benchmarks complete"
      
      # Checkout PR branch again for comparison
      - name: Return to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
      
      # Compare results and detect regressions
      - name: Analyze benchmark results
        if: github.event_name == 'pull_request'
        run: |
          cargo run --manifest-path scripts/benchmark-compare/Cargo.toml -- \
            --baseline-dir target/criterion \
            --current-baseline main \
            --new-baseline current \
            --threshold 10.0 \
            --output benchmark-results/comparison.json \
            --output-markdown benchmark-results/comparison.md
      
      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          if [ -f benchmark-results/regressions-detected ]; then
            echo "❌ Performance regressions detected!"
            cat benchmark-results/comparison.md
            exit 1
          else
            echo "✅ No significant performance regressions detected"
            cat benchmark-results/comparison.md
          fi
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 90
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔬 Performance Benchmark Results\n\n';
            
            if (fs.existsSync('benchmark-results/comparison.md')) {
              const comparison = fs.readFileSync('benchmark-results/comparison.md', 'utf8');
              comment += comparison;
            } else {
              comment += 'Benchmark comparison not available.\n';
            }
            
            comment += '\n---\n';
            comment += '*Benchmarks run on: `' + process.env.RUNNER_OS + '`*\n';
            comment += '*Threshold for regression: 10%*\n';
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Performance Benchmark Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
      
      - name: Store baseline for main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Storing baseline for future comparisons..."
          # Baselines are stored in target/criterion and cached by rust-cache
