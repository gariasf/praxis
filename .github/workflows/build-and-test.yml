name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache APT packages
        uses: actions/cache@v3
        id: apt-cache
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/build-and-test.yml') }}

      - name: Install base dependencies
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential make \
          pkg-config ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          lsb-release

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2.0
        with:
          version: latest
          cache: true
        id: vulkan-setup

      - name: Cache build directory
        uses: actions/cache@v3
        with:
          path: |
            build
            !build/CMakeCache.txt
          key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure CMake
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          # Set environment variables for Vulkan SDK
          export VULKAN_SDK=/usr
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build --config Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build