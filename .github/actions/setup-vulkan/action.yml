name: 'Setup Vulkan SDK'
description: 'Installs the Vulkan SDK on Ubuntu runners'
outputs:
  vulkan-version:
    description: 'The installed Vulkan SDK version'
    value: ${{ steps.check-version.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Install Vulkan SDK
      shell: bash
      run: |
        # Add LunarG's signing key
        wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
        
        # Add LunarG's repository using direct detection
        UBUNTU_CODENAME=$(lsb_release -cs)
        echo "Using Ubuntu codename: ${UBUNTU_CODENAME}"
        
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${UBUNTU_CODENAME}.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-${UBUNTU_CODENAME}.list
        
        # Update package list
        sudo apt update
        
        # Install Vulkan SDK
        sudo apt install -y vulkan-sdk

    - name: Check Vulkan version
      id: check-version
      shell: bash
      run: |
        echo "Vulkan SDK installation info:"
        if command -v vulkaninfo &> /dev/null; then
          VULKAN_VERSION=$(vulkaninfo --summary 2>/dev/null | grep "Vulkan Instance Version" | awk '{print $4}')
          echo "version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT
          echo "Vulkan Instance Version: ${VULKAN_VERSION}"
        else
          echo "vulkaninfo not found, but SDK should be installed"
          echo "version=unknown" >> $GITHUB_OUTPUT
        fi
