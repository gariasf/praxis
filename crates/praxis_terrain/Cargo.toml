[package]
name = "praxis_terrain"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Vulkan rendering for terrain shaders
vulkano = "0.35.1"
vulkano-shaders = "0.35.0"

# GPU buffer data conversion (renderer.rs, mesh.rs)
bytemuck = { version = "1.23.1", features = ["derive"] }

# Internal dependencies
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_graphics = { path = "../praxis_graphics", version = "0.1.0" }
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# Heightmap image loading (heightmap.rs)
image = { version = "0.25", default-features = false, features = ["png"] }

# Procedural terrain noise generation (heightmap.rs)
noise = "0.9"

# Parallel mesh generation (mesh.rs, chunk.rs)
rayon = "1.10"

# Vegetation placement randomization (vegetation.rs)
rand = "0.8"
