[package]
name = "praxis_audio"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Audio playback library with CPAL backend
kira = { version = "0.9", features = ["cpal"] }

# Internal dependencies
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# Optional serialization for audio components
serde = { version = "1.0", features = ["derive"], optional = true }
ron = { version = "0.8", optional = true }

[features]
default = ["serialization"]
serialization = ["serde", "ron"]

[lints]
workspace = true
