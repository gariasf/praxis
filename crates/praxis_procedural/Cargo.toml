[package]
name = "praxis_procedural"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Vulkan compute shaders for GPU texture generation
vulkano = "0.35.1"
vulkano-shaders = "0.35.0"

# Internal dependencies
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }

# GPU buffer data conversion (generator.rs)
bytemuck = { version = "1.23.1", features = ["derive"] }

# Noise generation seeding (generator.rs)
rand = "0.8"

# Fast hashing for texture cache (cache.rs)
seahash = "4.1"

# Runtime GLSL to SPIR-V shader compilation (generator.rs)
shaderc = "0.8"
