[package]
name = "praxis_assets"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# 3D model format loaders
tobj = "4.0"                                           # OBJ file format loader
gltf = { version = "1.4", features = ["names"] }      # glTF 2.0 format loader with name preservation

# Internal dependencies
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_graphics = { path = "../praxis_graphics", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_scene = { path = "../praxis_scene", version = "0.1.0" }

# Async I/O (async_loader.rs)
tokio = { version = "1.40", features = ["fs", "rt", "sync"] }

# Thread-safe channels (async_loader.rs)
crossbeam-channel = "0.5"

# Async trait definitions (async_loader.rs)
async-trait = "0.1"
