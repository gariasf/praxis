[package]
name = "praxis_profiling"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Internal dependencies
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_graphics = { path = "../praxis_graphics", version = "0.1.0", optional = true }

# Vulkan GPU profiling (gpu_profiler.rs)
vulkano = "0.35.1"

# ECS framework
bevy_ecs = "0.14"

# Chrome trace format serialization (chrome_trace.rs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Thread-safe timing data storage (profiler.rs, system_profiler.rs)
parking_lot = "0.12"

[features]
default = ["graphics_integration"]
graphics_integration = ["praxis_graphics"]
