[package]
name = "praxis_scripting"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
notify = "6.1"
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
bevy_ecs = "0.14"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
