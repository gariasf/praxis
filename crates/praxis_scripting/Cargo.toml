[package]
name = "praxis_scripting"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Lua 5.4 scripting engine with vendored build and serialization support
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }

# File system watching for hot-reload (hot_reload.rs)
notify = "6.1"

# Internal dependencies
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# Thread-safe script state management (context.rs, hot_reload.rs)
parking_lot = "0.12"

# Serialization for script data exchange (bindings/)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
