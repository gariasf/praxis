[package]
name = "praxis_editor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
terrain = ["praxis_terrain"]

[dependencies]
# Internal dependencies
praxis_ecs = { path = "../praxis_ecs" }
praxis_math = { path = "../praxis_math" }
praxis_utils = { path = "../praxis_utils" }
praxis_gui = { path = "../praxis_gui" }
praxis_scene = { path = "../praxis_scene" }
praxis_assets = { path = "../praxis_assets" }
praxis_input = { path = "../praxis_input" }
praxis_graphics = { path = "../praxis_graphics" }
praxis_physics = { path = "../praxis_physics" }
praxis_audio = { path = "../praxis_audio" }
praxis_spatial = { path = "../praxis_spatial" }
praxis_terrain = { path = "../praxis_terrain", optional = true }

# ECS framework
bevy_ecs = "0.14"

# Editor GUI framework with docking support
egui = "0.29"
egui_dock = "0.14"                     # Dockable panel layout for editor
egui-winit = "0.29"

# Window and rendering (needed for editor panels)
winit = "0.30.11"
vulkano = "0.35.1"

# File system watching for asset hot-reload (panels/assets_panel.rs)
notify = "6.1"

# Image loading for thumbnails (panels/assets_panel.rs)
image = "0.25"

# Scene and editor state serialization (editor_state.rs, scene_operations.rs)
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Native file dialogs (scene_operations.rs)
rfd = "0.15"

# Timestamps for save files (scene_operations.rs)
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
