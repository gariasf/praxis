[package]
name = "praxis_spatial"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Internal dependencies
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_graphics = { path = "../praxis_graphics", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# GPU compute shaders for culling and LOD (gpu_culling.rs, gpu_integration.rs)
vulkano = "0.35.1"
vulkano-shaders = "0.35.0"

# GPU buffer data conversion (gpu_culling.rs)
bytemuck = { version = "1.23.1", features = ["derive"] }

[lints]
workspace = true
