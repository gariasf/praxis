[package]
name = "praxis_ecs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bevy_ecs = { version = "0.14", features = ["serialize"] }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_graphics = { path = "../praxis_graphics", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

[dev-dependencies]
praxis_physics = { path = "../praxis_physics", version = "0.1.0" }
praxis_audio = { path = "../praxis_audio", version = "0.1.0" }

[features]
test_physics = []
test_audio = []
