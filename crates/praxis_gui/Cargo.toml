[package]
name = "praxis_gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Internal dependencies
praxis_ecs = { path = "../praxis_ecs" }
praxis_math = { path = "../praxis_math" }
praxis_utils = { path = "../praxis_utils" }
praxis_physics = { path = "../praxis_physics" }
praxis_audio = { path = "../praxis_audio" }
praxis_scripting = { path = "../praxis_scripting", optional = true }

# Immediate mode GUI framework
egui = "0.29"
egui-winit = "0.29"                    # Winit integration for egui
egui_winit_vulkano = "0.28"            # Vulkan rendering backend for egui

# Window and rendering (needed for egui integration)
winit = "0.30.11"
vulkano = "0.35.1"

# Thread-safe GUI state management (gui_state.rs)
parking_lot = "0.12"

# Optional Lua scripting support for console (console_panel.rs)
mlua = { version = "0.9", optional = true }

[features]
default = []
scripting = ["praxis_scripting", "mlua"]
