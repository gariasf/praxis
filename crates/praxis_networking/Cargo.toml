[package]
name = "praxis_networking"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Guillem Arias <hello@gariasf.com>"]

[dependencies]
# Internal dependencies
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_profiling = { path = "../praxis_profiling", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# Async networking runtime (transport.rs, server.rs, client.rs)
tokio = { version = "1.40", features = ["full"] }

# Binary serialization for network messages (message.rs, replication.rs)
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Error handling
color-eyre = "0.6"

# Logging
tracing = "0.1"

# Thread-safe channels (transport.rs)
crossbeam-channel = "0.5"

# Thread-safe synchronization primitives (various)
parking_lot = "0.12"

# Concurrent hash map (profiler.rs, server.rs)
dashmap = "6.1"
