[package]
name = "praxis_networking"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Guillem Arias <hello@gariasf.com>"]

[dependencies]
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }
praxis_profiling = { path = "../praxis_profiling", version = "0.1.0" }

bevy_ecs = "0.14"
tokio = { version = "1.40", features = ["full"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
color-eyre = "0.6"
tracing = "0.1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6.1"
