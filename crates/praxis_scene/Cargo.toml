[package]
name = "praxis_scene"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Internal dependencies
praxis_ecs = { path = "../praxis_ecs", version = "0.1.0" }
praxis_math = { path = "../praxis_math", version = "0.1.0" }
praxis_utils = { path = "../praxis_utils", version = "0.1.0" }

# ECS framework
bevy_ecs = "0.14"

# Scene and animation serialization (definition.rs, animation.rs, save.rs)
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Save file timestamps (save.rs)
chrono = "0.4"

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
